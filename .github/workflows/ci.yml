# Every claim this project makes is a number, and every number is a gate.
#
# The benchmarks are not reports that someone reads once — they fail the build.
# Precision below 99% on credentials, or below 90% on names in prose, is a
# broken build, not a note in a changelog.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: there are no runtime or test dependencies.
      - name: Tests
        run: node --test test/*.test.js

      - name: Credential benchmark
        run: node bench/run.js --no-color

      - name: Prose benchmark
        run: node bench/ner.js --no-color

      - name: Benchmark across ten seeds
        run: |
          for seed in 1 7 42 999 20260925 31337 8675309 2718281 1414213 77777; do
            node bench/run.js --seed "$seed" --json > /dev/null || exit 1
          done

      - name: Build both store packages
        run: node scripts/build.js

      - name: Extension must not be able to reach the network
        run: |
          if grep -rnE '(^|[^.[:alnum:]_])fetch[[:space:]]*\(|new[[:space:]]+(XMLHttpRequest|WebSocket|EventSource)[[:space:]]*\(|\.sendBeacon[[:space:]]*\(' \
               --include='*.js' src extension --exclude-dir=engine; then
            echo "::error::a shipped module references a network API"
            exit 1
          fi
          node -e "
            const m = require('./dist/chrome/manifest.json');
            // 'scripting' is here for exactly one thing: registering this same
            // content script on a site the person adds from the popup. It
            // grants no network access. Anything beyond these two, or any
            // network permission at all, fails the build.
            const allowed = ['storage', 'scripting'];
            const extra = m.permissions.filter((p) => !allowed.includes(p));
            if (extra.length) { console.error('unexpected permissions:', extra); process.exit(1); }
            const forbidden = ['webRequest', 'webRequestBlocking', 'proxy', 'declarativeNetRequest', 'cookies', 'history', 'downloads', 'clipboardRead'];
            for (const p of forbidden.concat(m.host_permissions || [])) {
              if (forbidden.includes(p) && m.permissions.includes(p)) { console.error('forbidden permission:', p); process.exit(1); }
            }
            if (m.description.length > 132) { console.error('description is', m.description.length, 'characters; the store limit is 132'); process.exit(1); }
          "

      - name: Document extraction, against real fixtures
        run: |
          python3 tools/make-fixtures.py
          git diff --exit-code --stat -- test/fixtures \
            || { echo "::error::the fixtures in test/fixtures do not match tools/make-fixtures.py"; exit 1; }

      - name: Chhanni scans itself
        run: node bin/chhanni.js scan src bin bench scripts --quiet --no-color || true
