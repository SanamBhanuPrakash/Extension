# Every claim this project makes is a number, and every number is a gate.
#
# The benchmarks are not reports that someone reads once — they fail the build.
# Precision below 99% on credentials, or below 90% on names in prose, is a
# broken build, not a note in a changelog.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: there are no runtime or test dependencies.
      - name: Tests
        run: node --test test/*.test.js

      - name: Credential benchmark
        run: node bench/run.js --no-color

      - name: Prose benchmark
        run: node bench/ner.js --no-color

      - name: Benchmark across ten seeds
        run: |
          for seed in 1 7 42 999 20260925 31337 8675309 2718281 1414213 77777; do
            node bench/run.js --seed "$seed" --json > /dev/null || exit 1
          done

      - name: Build both store packages
        run: node scripts/build.js

      - name: Extension must not be able to reach the network
        run: |
          if grep -rnE '(^|[^.[:alnum:]_])fetch[[:space:]]*\(|new[[:space:]]+(XMLHttpRequest|WebSocket|EventSource)[[:space:]]*\(|\.sendBeacon[[:space:]]*\(' \
               --include='*.js' src extension --exclude-dir=engine; then
            echo "::error::a shipped module references a network API"
            exit 1
          fi
          node -e "
            const m = require('./dist/chrome/manifest.json');
            // 'scripting' is here for exactly one thing: registering this same
            // content script on a site the person adds from the popup. It
            // grants no network access. Anything beyond these two, or any
            // network permission at all, fails the build.
            const allowed = ['storage', 'scripting'];
            const extra = m.permissions.filter((p) => !allowed.includes(p));
            if (extra.length) { console.error('unexpected permissions:', extra); process.exit(1); }
            const forbidden = ['webRequest', 'webRequestBlocking', 'proxy', 'declarativeNetRequest', 'cookies', 'history', 'downloads', 'clipboardRead'];
            for (const p of forbidden.concat(m.host_permissions || [])) {
              if (forbidden.includes(p) && m.permissions.includes(p)) { console.error('forbidden permission:', p); process.exit(1); }
            }
            if (m.description.length > 132) { console.error('description is', m.description.length, 'characters; the store limit is 132'); process.exit(1); }
          "

      - name: Document extraction, against real fixtures
        run: |
          python3 tools/make-fixtures.py
          git diff --exit-code --stat -- test/fixtures \
            || { echo "::error::the fixtures in test/fixtures do not match tools/make-fixtures.py"; exit 1; }

      - name: Documentation still describes the code
        run: node scripts/check-docs.js --no-color

      # The release gate, minus the parts that need a browser — those run as
      # their own steps below. A FAIL here is a release blocker by definition;
      # a BLOCKED criterion is one this runner cannot check and is listed in
      # docs/RELEASE-GATE.md rather than skipped.
      #
      # Deliberately not --release. That mode asks "can this ship" and exits 2
      # on a BLOCKED criterion, which would fail every push over provider
      # certification — work no CI runner can do — and train everybody to
      # ignore the gate. The question CI asks is "did this break anything".
      - name: The release gate
        run: node scripts/gate.js --no-color

      # The engine suite cannot prove the product works. Four separate ways
      # past the guard shipped in 0.4.0 with 115 Node tests passing: clicking
      # Send, submitting a form, pasting a screenshot, and a composer inside an
      # iframe inside a shadow root. Each of those is a browser fact.
      #
      # Playwright is installed here and nowhere else, so `npm test` stays
      # dependency-free and a contributor without it still gets a green run.
      - name: Install a browser for the end-to-end suite
        if: matrix.node == '22.x'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Content must not reach the provider
        if: matrix.node == '22.x'
        run: node test/e2e/run.mjs --no-color

      # The certification harness itself, against file:// fixtures standing in
      # for a signed-in provider and a login wall.
      #
      # It is here because the harness's sign-in phase was described in its own
      # header for weeks with no code behind it, and nothing noticed: the only
      # thing that drives the real five is a person with five accounts, so the
      # one step between this repository and a finished V1 was the step no test
      # touched. A first run therefore walked five login walls, wrote NOT
      # TESTED fifty times and exited 2.
      - name: The certification harness can be run by a person
        if: matrix.node == '22.x'
        run: node --test test/provider/signin.test.mjs

      # What the extension costs, which is what gets one uninstalled. The
      # budgets are in test/perf/run.mjs with the reasoning for each; they
      # fail the build the same way a wrong answer does. This job is also the
      # only thing in CI that drives a *moving* page, and the only thing that
      # would have caught a response scanner whose debounce had no ceiling —
      # which is to say, one that never ran on any site it matched.
      - name: What it costs to have Chhanni on the page
        if: matrix.node == '22.x'
        run: node test/perf/run.mjs --no-color

      - name: The package is reproducible
        if: matrix.node == '22.x'
        run: |
          node scripts/package.js --no-color
          node scripts/package.js --verify --no-color

      - name: Hostile input against the parsers
        run: node bench/fuzz.js --cases 20000 --no-color --quiet

      - name: Chhanni scans itself
        run: node bin/chhanni.js scan src bin bench scripts --quiet --no-color || true
