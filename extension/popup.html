<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chhanni</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 348px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 26px; height: 26px; border-radius: 6px; }
  .title { flex: 1; min-width: 0; }
  .title strong { display: block; font-size: 13.5px; line-height: 1.2; }
  .title span { color: var(--muted); font-size: 11.5px; }
  .status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--faint); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 13px 8px; text-align: center; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: none; }
  .stat b { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; color: var(--muted); }

  section { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin: 0 0 9px; font-weight: 600; }

  .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 7px; font-size: 12px; }
  .bar .track { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: -3px; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .bar b { font-weight: 500; }
  .bar em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

  ul { list-style: none; margin: 0; padding: 0; max-height: 186px; overflow-y: auto; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  .row { display: flex; align-items: baseline; gap: 7px; }
  .row b { font-weight: 500; font-size: 12px; }
  .row code { font-size: 10.5px; color: var(--muted); background: var(--surface); border-radius: 4px; padding: 1px 4px; margin-left: auto; }
  .meta { font-size: 10.5px; color: var(--faint); margin-top: 1px; }
  .meta .redacted { color: var(--ok); }
  .meta .sent { color: var(--high); }

  .empty { color: var(--muted); font-size: 12px; padding: 4px 0 2px; }
  .empty b { display: block; color: var(--fg); font-weight: 500; margin-bottom: 2px; }

  .controls { display: flex; align-items: center; gap: 9px; padding: 12px 16px; }
  .controls label { font-size: 11.5px; color: var(--muted); }
  select { font: inherit; font-size: 12px; padding: 5px 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); flex: 1; }
  footer { display: flex; gap: 14px; padding: 0 16px 13px; font-size: 11.5px; }
  footer .spacer { flex: 1; }
  .promise { padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <div class="title">
      <strong>Chhanni</strong>
      <span id="site">checking…</span>
    </div>
    <div class="status"><i class="dot" id="dot"></i><span id="statusText">on</span></div>
  </header>

  <div class="stats">
    <div class="stat"><b id="nCaught">0</b><span>caught</span></div>
    <div class="stat"><b id="nRedacted">0</b><span>redacted</span></div>
    <div class="stat"><b id="nDistinct">0</b><span>distinct</span></div>
  </div>

  <section id="breakdownSection" hidden>
    <h2>Most often</h2>
    <div id="breakdown"></div>
  </section>

  <section>
    <h2>Recent</h2>
    <ul id="recent"></ul>
    <div class="empty" id="empty" hidden>
      <b>Nothing caught yet.</b>
      That is the expected state. Chhanni only speaks up when your prompt
      carries something worth stopping for.
    </div>
  </section>

  <div class="controls">
    <label for="mode">Interrupt on</label>
    <select id="mode">
      <option value="strict">everything found</option>
      <option value="warn">credentials &amp; identifiers</option>
      <option value="off">nothing — off</option>
    </select>
  </div>

  <footer>
    <button class="link" id="settings">All detectors</button>
    <span class="spacer"></span>
    <button class="link" id="clear">Clear history</button>
  </footer>

  <div class="promise">Checked on this device. Chhanni has no network permission and makes no request.</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
