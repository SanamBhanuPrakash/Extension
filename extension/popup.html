<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chhanni</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 13px; }
  header img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 1px 3px rgba(9,14,22,.2); }
  .title { flex: 1; min-width: 0; }
  .title strong { display: block; font-size: 13.5px; line-height: 1.25; letter-spacing: -.01em; font-weight: 590; }
  .title span { color: var(--muted); font-size: 11.5px; }
  .status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(31,122,77,.16); }
  .dot.off { background: var(--faint); box-shadow: 0 0 0 3px rgba(139,147,161,.14); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; }
  .stat { padding: 13px 8px; text-align: center; position: relative; }
  .stat + .stat::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: 0.5px; background: var(--hairline); }
  .stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; color: var(--muted); }

  section { padding: 12px 14px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .075em; color: var(--faint); margin: 0 0 9px; font-weight: 590; }

  .bar { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; margin-bottom: 9px; font-size: 12px; }
  .bar:last-child { margin-bottom: 0; }
  .bar .track { grid-column: 1 / -1; height: 4px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), color-mix(in oklab, var(--accent) 65%, var(--critical))); }
  .bar b { font-weight: 510; }
  .bar em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

  ul {
    list-style: none; margin: 0; padding: 0; max-height: 200px; overflow-y: auto;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent 100%);
  }
  ul::-webkit-scrollbar { width: 7px; }
  ul::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
  li { padding: 8px 0; border-top: 0.5px solid var(--hairline); }
  li:first-child { border-top: none; padding-top: 0; }
  .row { display: flex; align-items: baseline; gap: 7px; }
  .row b { font-weight: 510; font-size: 12px; }
  .row code { font-size: 10.5px; color: var(--muted); background: var(--sunken); border-radius: 5px; padding: 2px 5px; margin-left: auto; }
  .meta { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
  .meta .redacted { color: var(--ok); }
  .meta .sent { color: var(--high); }

  .empty { color: var(--muted); font-size: 12px; }
  .empty b { display: block; color: var(--text); font-weight: 510; margin-bottom: 2px; }

  .controls { display: flex; align-items: center; gap: 9px; padding: 11px 14px; }
  .controls label { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  select {
    font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 9px;
    border: 0.5px solid var(--hairline); background: var(--glass-strong); color: var(--text); flex: 1;
  }
  footer { display: flex; gap: 14px; align-items: center; padding: 0 4px; font-size: 11.5px; }
  footer .spacer { flex: 1; }
  .promise { padding: 10px 14px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <header class="glass">
    <img src="icons/icon-48.png" alt="">
    <div class="title">
      <strong>Chhanni</strong>
      <span id="site">checking…</span>
    </div>
    <div class="status"><i class="dot" id="dot"></i><span id="statusText">on</span></div>
  </header>

  <div class="stats glass">
    <div class="stat"><b id="nCaught">0</b><span>caught</span></div>
    <div class="stat"><b id="nRedacted">0</b><span>redacted</span></div>
    <div class="stat"><b id="nDistinct">0</b><span>distinct</span></div>
  </div>

  <section id="breakdownSection" class="glass" hidden>
    <h2>Most often</h2>
    <div id="breakdown"></div>
  </section>

  <section class="glass">
    <h2>Recent</h2>
    <ul id="recent"></ul>
    <div class="empty" id="empty" hidden>
      <b>Nothing caught yet.</b>
      That is the expected state. Chhanni only speaks up when your prompt
      carries something worth stopping for.
    </div>
  </section>

  <div class="controls glass">
    <label for="mode">Interrupt on</label>
    <select id="mode">
      <option value="strict">everything found</option>
      <option value="warn">credentials &amp; identifiers</option>
      <option value="off">nothing — off</option>
    </select>
  </div>

  <footer>
    <button class="link" id="settings">All detectors</button>
    <span class="spacer"></span>
    <button class="link" id="clear">Clear history</button>
  </footer>

  <div class="promise glass">Checked on this device. Chhanni has no network permission and makes no request.</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
